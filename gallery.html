        .qe-form input { padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.95rem; flex: 1; min-width: 140px; }
        .qe-form input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.2); }
        .qe-form button { padding: 12px 24px; background: var(--royal-blue); color: var(--white); border: none; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
        .qe-form button:hover { background: var(--gold); color: var(--royal-blue); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(212,175,55,0.4); }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;

            padding: 20px 20px 10px;
            border-bottom: 1px solid rgba(212,175,55,0.2);

        .filter-btn {

            border-color: #001a4d;

        .gallery {

            gap: 20px;
            padding: 30px;
        }
        .gallery-item {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0,35,102,0.15);
        }
        .gallery-item.hidden {
            display: none;
        }
        .gallery-item img {

            height: 220px;
            object-fit: cover;
            display: block;
        }
        .gallery-caption {

            letter-spacing: 0.5px;
            margin-bottom: 8px;

        .gallery-caption .service-tag.tv { background: var(--gold-light); color: var(--royal-blue); }

        .gallery-caption .service-tag.blinds { background: #F3E5F5; color: #7B1FA2; }

        .gallery-caption .service-tag.led { background: #FFF8E1; color: #F57F17; }

        .gallery-caption p { font-size: 0.85rem; color: var(--text-muted); }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .lightbox.open {
            opacity: 1;
            visibility: visible;
        }
        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .lightbox.open img { transform: scale(1); }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }
        .lightbox-close:hover { background: rgba(255,255,255,0.2); }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        .lightbox-caption {
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: var(--white);
            max-width: 90vw;
            padding: 12px 20px;
            pointer-events: none;
        }
        .lightbox-caption h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 4px; }
        .lightbox-caption p { font-size: 0.95rem; opacity: 0.8; }

        .back-link {
            display: block;
            text-align: center;
            margin: 20px 0 40px;
            color: var(--royal-blue);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }

        /* SEO Enhancements */

        .container { position: relative; z-index: 2; }

        .crt-overlay.active { opacity: 1; }
        .nav-btn { flex:1; min-width:140px; max-width:200px; padding:14px 24px; border-radius:12px; font-weight:700; cursor:pointer; transition: all 0.2s ease; font-family:'Inter',sans-serif; font-size:0.95rem; border:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }
        .nav-btn-primary { background: var(--royal-blue); color: var(--white); }
        .nav-btn-primary:hover { background:#001a4d; transform:translateY(-2px); box-shadow: 0 6px 20px rgba(0,35,102,0.3); }
        .nav-btn-gold { background: var(--gold); color: var(--royal-blue); }
        .nav-btn-gold:hover { background:#c4a030; transform:translateY(-2px); box-shadow: 0 6px 20px rgba(212,175,55,0.4); }
        .nav-btn-back { background:#f8f8f8; color:#666; border:1.5px solid #e0e0e0; }
        .nav-btn-back:hover { background:#eee; color:#1A1A1A; border-color:#ccc; }
        @media (prefers-reduced-motion: reduce) {
            .crt-overlay { display: none; }
            body { opacity: 1 !important; transition: none !important; }
