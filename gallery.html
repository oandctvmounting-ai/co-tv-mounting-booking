        }
        header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 80px; height: 3px; background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light)); border-radius: 2px; }
        header h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 10px; }
        /* Horizontal scrollable gallery */

            -webkit-overflow-scrolling: touch;

            -ms-overflow-style: none;
        }
        .gallery-wrapper::-webkit-scrollbar { width: var(--scrollbar-width); background: var(--black); }
        .gallery-wrapper::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
        .gallery-wrapper::-webkit-scrollbar-thumb:hover { background: var(--gold-light); }
        /* Gallery grid of images in a single row that wraps */
        .gallery-grid {                white-space: nowrap;
            display: flex;
            
            gap: 16px;
            /* No horizontal flex-basis constraint so images sit in a row */
        }
        /* Each image card */
        .gallery-item {
            flex: 0 0 auto;
            width: 280px;
            min-width: 260px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            /* Safari better scrolling */
            scroll-snap-align: start;
        }
        .gallery-item:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 30px rgba(212,175,55,0.2);
        }
        .gallery-item img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover img { transform: scale(1.05); }
        /* Overlay with title/desc */
        .overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 16px; background: linear-gradient(transparent 0%, rgba(0,0,0,0.8) 100%);
            color: var(--white); font-family: 'Playfair Display', serif;
            opacity: 0; transition: opacity 0.25s ease;
        }
        .gallery-item:hover .overlay { opacity: 1; }
        .overlay .title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .overlay .desc { font-size: 0.75rem; opacity: 0.8; line-height: 1.2; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        /* Scrollbar aesthetic */

            .gallery-item { min-width: 240px; }
