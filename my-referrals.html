<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23002366'/><rect x='8' y='7' width='16' height='11' rx='2' fill='%231A1A1A' stroke='%23D4AF37' stroke-width='1.5'/><rect x='6' y='5' width='3' height='22' rx='1' fill='%23002366'/></svg>">
    <meta name="description" content="C&O TV Mounting — View My Referrals">
    <title>My Referrals | C&O TV Mounting</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "C&O TV Mounting",
      "description": "Professional TV mounting, electric fireplace installation, blinds & shades, mirrors, LED lighting, and soundbar mounting across the Dallas-Fort Worth metroplex.",
      "url": "https://oandctvmounting-ai.github.io/co-tv-mounting-booking/",
      "areaServed": "Dallas-Fort Worth Metroplex, TX",
      "telephone": "+1-817-523-9753",
      "address": { "@type": "PostalAddress", "addressLocality": "Irving", "addressRegion": "TX", "addressCountry": "US" },
      "priceRange": "$$"
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0a0a0a;
            --black-soft: #141414;
            --royal-blue: #002366;
            --gold: #D4AF37;
            --gold-light: #F9F4E8;
            --glass: rgba(255,255,255,0.06);
            --glass-border: rgba(212,175,55,0.3);
            --white: #FFFFFF;
            --text-light: rgba(255,255,255,0.85);
            --text-muted: rgba(255,255,255,0.5);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.2s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            background-attachment: fixed;
            color: var(--text-light); line-height: 1.6; min-height: 100vh;
        }
        .topbar {
            text-align: center; padding: 16px 20px;
            background: rgba(0,35,102,0.9); border-bottom: 2px solid var(--gold);
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .topbar a {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--gold); color: var(--royal-blue);
            padding: 10px 28px; border-radius: 10px; font-weight: 800;
            font-size: 0.95rem; text-decoration: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3); transition: all var(--transition);
        }
        .topbar a:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,175,55,0.4); }
        .header {
            text-align: center; padding: 40px 24px 24px; max-width: 760px; margin: 0 auto;
        }
        .header h1 {
            font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--white);
            margin-bottom: 6px; font-weight: 700;
        }
        .header h1 .gold { color: var(--gold); }
        .header p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }
        .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 40px; }
        .card {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: var(--radius); padding: 28px; margin-bottom: 16px;
            backdrop-filter: blur(12px);
        }
        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block; font-size: 0.82rem; font-weight: 700;
            color: var(--gold-light); margin-bottom: 6px;
        }
        .input-group input {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid rgba(212,175,55,0.2); border-radius: 8px;
            font-family: 'Inter', sans-serif; font-size: 0.95rem;
            transition: all var(--transition);
            background: rgba(0,0,0,0.4); color: var(--white);
        }
        .input-group input:focus {
            outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.3); }
        .btn {
            padding: 14px 20px; border-radius: 10px; font-weight: 700; cursor: pointer;
            transition: all var(--transition); font-family: 'Inter', sans-serif; font-size: 0.95rem;
            border: none; text-decoration: none; display: inline-flex; align-items: center;
            justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--royal-blue); color: var(--white); }
        .btn-primary:hover { background: #001a4d; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,35,102,0.4); }
        .btn-gold { background: var(--gold); color: var(--royal-blue); }
        .btn-gold:hover { background: #c4a030; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,175,55,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1.5px solid rgba(255,255,255,0.12); }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); color: var(--white); }

        .section-title {
            font-family: 'Playfair Display', serif; color: var(--gold);
            font-size: 1.2rem; margin-bottom: 16px;
        }
        .partner-info {
            font-weight: 700; color: var(--gold-light); font-size: 0.9rem;
        }
        .referral-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .referral-table th, .referral-table td {
            padding: 12px; text-align: left;
            border-bottom: 1px solid rgba(212,175,55,0.12);
        }
        .referral-table th {
            color: var(--gold); font-weight: 700; font-size: 0.78rem;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .referral-table td { font-size: 0.85rem; color: var(--text-light); }
        .referral-table tr:hover td { background: rgba(212,175,55,0.04); }
        .status-badge {
            display: inline-block; padding: 4px 10px; border-radius: 999px;
            font-size: 0.72rem; font-weight: 700; text-transform: capitalize;
        }
        .status-new { background: rgba(66,165,245,0.2); color: #64b5f6; }
        .status-contacted { background: rgba(255,152,0,0.2); color: #ffb74d; }
        .status-quoted { background: rgba(186,104,200,0.2); color: #ce93d8; }
        .status-booked { background: rgba(76,175,80,0.2); color: #81c784; }
        .status-paid { background: rgba(212,175,55,0.2); color: var(--gold); }
        .table-scroll { overflow-x: auto; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.4; }
        .hidden { display: none !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--royal-blue); color: var(--gold);
            padding: 14px 24px; border-radius: 999px; font-weight: 700;
            border: 2px solid var(--gold); box-shadow: 0 8px 24px rgba(0,35,102,0.3);
            opacity: 0; transition: all 0.3s ease; z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="index.html">← Back to Home & Book Now</a>
    </div>
    <div class="header">
        <h1>My <span class="gold">Referrals</span></h1>
        <p>Enter your partner email to view all your referrals and their status.</p>
    </div>
    <div class="wrap">
        <div class="card" id="email-form-card">
            <form id="email-form">
                <div class="input-group">
                    <label>Partner Email *</label>
                    <input type="email" id="partner-email" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">View My Referrals →</button>
            </form>
        </div>

        <div class="card hidden" id="referrals-section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
                <span class="partner-info" id="partner-info"></span>
                <a href="referral.html" class="btn btn-secondary" style="padding:8px 16px;font-size:0.82rem;">← Submit Another</a>
            </div>
            <div class="table-scroll" id="referrals-table-container"></div>
        </div>

        <div class="card hidden" id="empty-state">
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="rgba(212,175,55,0.4)" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M9 12l2 2 4-4" stroke="rgba(212,175,55,0.4)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <p>No referrals found for this email.</p>
                <p style="margin-top:8px;font-size:0.82rem;">Make sure you're using the same email you used when submitting referrals.</p>
            </div>
            <a href="referral.html" class="btn btn-gold" style="mt:16px;max-width:300px;margin:16px auto 0;">Submit a Referral</a>
        </div>

        <div class="card hidden" id="loading-state">
            <div style="text-align:center;padding:40px;">
                <div style="width:40px;height:40px;border:3px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;"></div>
                <p style="color:var(--text-muted);">Loading your referrals...</p>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
    const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwR4VnnJrI4eZrbSNds-LoRaEzNZ8oS04r8PfUOaDDiQHUIp3qTaoSn4jVZyn_5L1s/exec';

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    async function loadReferrals() {
        const email = document.getElementById('partner-email').value.trim().toLowerCase();
        if (!email) { showToast('Please enter your email'); return; }
        const emailForm = document.getElementById('email-form-card');
        const loading = document.getElementById('loading-state');
        const container = document.getElementById('referrals-section');
        const emptyState = document.getElementById('empty-state');
        const tableContainer = document.getElementById('referrals-table-container');
        emailForm.classList.add('hidden');
        loading.classList.remove('hidden');
        container.classList.add('hidden');
        emptyState.classList.add('hidden');
        try {
            const url = APP_SCRIPT_URL + '?action=get_referrals&partnerEmail=' + encodeURIComponent(email);
            const res = await fetch(url);
            const data = await res.json();
            loading.classList.add('hidden');
            if (data.referrals && data.referrals.length > 0) {
                document.getElementById('partner-info').textContent = data.partnerName ? data.partnerName + ' (' + email + ')' : email;
                let html = '<table class="referral-table"><thead><tr><th>Date</th><th>Code</th><th>Client</th><th>Service</th><th>Status</th><th>Paid Date</th><th>Payout</th></tr></thead><tbody>';
                data.referrals.forEach(r => {
                    const statusClass = 'status-' + (r.status || 'new').toLowerCase();
                    html += '<tr><td>' + (r.date || '—') + '</td><td style="font-weight:700;color:var(--gold)">' + (r.referralCode || '—') + '</td><td>' + (r.clientName || '—') + '</td><td>' + (r.jobService || '—') + '</td><td><span class="status-badge ' + statusClass + '">' + (r.status || 'New') + '</span></td><td>' + (r.paidDate || '—') + '</td><td style="color:var(--gold);font-weight:700">' + (r.payout || '—') + '</td></tr>';
                });
                html += '</tbody></table>';
                tableContainer.innerHTML = html;
                container.classList.remove('hidden');
            } else {
                emptyState.classList.remove('hidden');
            }
        } catch (err) {
            console.error('Error loading referrals:', err);
            loading.classList.add('hidden');
            emptyState.classList.remove('hidden');
            showToast('Error loading referrals. Try again.');
        }
    }
    document.getElementById('email-form').addEventListener('submit', function(e) {
        e.preventDefault();
        loadReferrals();
    });
    </script>
</body>
</html>
